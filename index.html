<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Stone Realm — Prototype 3D</title>
<link rel="stylesheet" href="./styles/main.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-box">
      <div class="loading-title">STONE REALM</div>
      <div class="loading-bar-track"><div id="loading-bar-fill"></div></div>
      <div class="loading-hint">Chargement du prototype…</div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="objective-panel" class="panel glass">
      <div class="objective-title">OBJECTIF</div>
      <div class="objective-text">Explorez la zone et ramassez des pierres. Sélectionnez-en une et lancez-la.</div>
    </div>

    <div id="notification-container"></div>

    <div id="interaction-prompt" class="panel glass hidden">
      <span class="prompt-icon">🪨</span>
      <span class="prompt-text">Pierre</span>
      <span class="prompt-key" id="prompt-key">[E] Ramasser</span>
    </div>

    <div id="hotbar" class="panel glass"></div>

    <div id="inventory-panel" class="panel glass hidden">
      <div class="inventory-title">INVENTAIRE</div>
      <div id="inventory-slots"></div>
    </div>

    <button id="quality-toggle" class="panel glass small-btn" title="Qualité graphique">QUALITÉ: MOYENNE</button>

    <div id="pc-controls-hint" class="panel glass hint">
      ZQSD/WASD déplacement · SHIFT courir · ESPACE sauter · E ramasser · Clic lancer · Souris caméra · I inventaire
    </div>
  </div>

  <!-- Mobile touch controls -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-nub"></div>
      </div>
    </div>
    <div id="camera-touch-zone"></div>
    <div id="action-buttons">
      <button id="btn-jump" class="touch-btn">🦘</button>
      <button id="btn-pickup" class="touch-btn">🪨</button>
      <button id="btn-throw" class="touch-btn">🎯</button>
      <button id="btn-run" class="touch-btn small">RUN</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
